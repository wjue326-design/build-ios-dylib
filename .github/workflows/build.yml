name: build-ios-dylib
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: xcrun --sdk iphoneos --show-sdk-version && clang --version | head -1

      - name: Patch + build
        run: bash build.sh

      - name: Upload dylib
        uses: actions/upload-artifact@v4
        with:
          name: libXSPlugin
          path: ios-src/libXSPlugin.*.dylib
          if-no-files-found: error
